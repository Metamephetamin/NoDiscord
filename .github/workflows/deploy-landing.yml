name: Deploy Landing

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "landing/**"

concurrency:
  group: deploy-landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-master:
    name: Проверить release-ветку
    runs-on: ubuntu-latest

    steps:
      - name: Проверить, что workflow запущен из master
        shell: bash
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF_NAME" != "master" ]; then
            echo "Продакшен-деплой landing разрешён только из ветки master. Текущая ветка: $GITHUB_REF_NAME" >&2
            exit 1
          fi

  deploy:
    name: Deploy Landing to Server
    runs-on: ubuntu-latest
    needs: guard-master
    environment: production-landing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        id: validate
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets are not fully configured. Skipping landing deploy."
            exit 0
          fi
          if [ -z "$DEPLOY_SSH_KNOWN_HOSTS" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_SSH_KNOWN_HOSTS is empty or missing. Configure pinned SSH known_hosts before deploying landing."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Setup SSH agent
        if: steps.validate.outputs.ready == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Install pinned deploy known_hosts
        if: steps.validate.outputs.ready == 'true'
        shell: bash
        env:
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -l -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Sync landing to server
        if: steps.validate.outputs.ready == 'true'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          LANDING_DEPLOY_PATH: ${{ vars.LANDING_DEPLOY_PATH }}
          LANDING_DEPLOY_OWNER: ${{ vars.LANDING_DEPLOY_OWNER }}
          LANDING_HEALTHCHECK_URL: ${{ vars.LANDING_HEALTHCHECK_URL }}
        run: |
          PORT="${DEPLOY_PORT:-22}"
          LANDING_PATH="${LANDING_DEPLOY_PATH:-/var/www/tend-land/current}"
          LANDING_OWNER="${LANDING_DEPLOY_OWNER:-www-data:www-data}"
          HEALTHCHECK="${LANDING_HEALTHCHECK_URL:-https://land.lanaya.space}"
          TEMP_ROOT="/tmp/tend-landing-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SSH_OPTS="-p $PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$TEMP_ROOT/landing' '$LANDING_PATH'"

          rsync -az --delete -e "ssh $SSH_OPTS" ./landing/ "$DEPLOY_USER@$DEPLOY_HOST:$TEMP_ROOT/landing/"

          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            LANDING_PATH='$LANDING_PATH'
            TEMP_ROOT='$TEMP_ROOT'
            LANDING_OWNER='$LANDING_OWNER'
            case \"\$LANDING_PATH\" in
              /var/www/*) ;;
              *)
                echo \"Unsafe deploy path: \$LANDING_PATH\" >&2
                exit 1
                ;;
            esac
            rsync -az --delete --exclude 'Lanaya Setup.exe' \"\$TEMP_ROOT/landing/\" \"\$LANDING_PATH/\"
            chown -R \"\$LANDING_OWNER\" \"\$LANDING_PATH\"
            systemctl reload nginx
            rm -rf \"\$TEMP_ROOT\"
          "

          curl --fail --silent --show-error --location "$HEALTHCHECK" > /dev/null
