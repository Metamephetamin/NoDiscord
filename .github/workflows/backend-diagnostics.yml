name: Backend Diagnostics

on:
  workflow_dispatch:

env:
  NODE_VERSION: "22"

jobs:
  collect:
    name: Collect Backend Logs
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Collect backend diagnostics
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          BACKEND_SERVICE_NAME: ${{ vars.BACKEND_SERVICE_NAME }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          BACKEND_SERVICE="${BACKEND_SERVICE_NAME:-nodiscord-backend.service}"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -p "$PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts || true
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -p $PORT -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "bash -lc '
            echo \"=== systemctl status ===\"
            systemctl status \"$BACKEND_SERVICE\" --no-pager || true
            echo \"=== upload storage df ===\"
            df -h /opt/nodiscord/.deploy/storage /opt/nodiscord/.deploy/backend 2>/dev/null || true
            echo \"=== upload storage inodes ===\"
            df -ih /opt/nodiscord/.deploy/storage /opt/nodiscord/.deploy/backend 2>/dev/null || true
            echo \"=== upload storage permissions ===\"
            ls -ld /opt/nodiscord /opt/nodiscord/.deploy /opt/nodiscord/.deploy/storage /opt/nodiscord/.deploy/storage/chat-files 2>/dev/null || true
            echo \"=== upload storage size ===\"
            find /opt/nodiscord/.deploy/storage/chat-files -maxdepth 1 -type f 2>/dev/null | wc -l || true
            du -sh /opt/nodiscord/.deploy/storage/chat-files 2>/dev/null || true
            echo \"=== recent upload/storage logs ===\"
            journalctl -u \"$BACKEND_SERVICE\" --since \"2 hours ago\" --no-pager | grep -Ei \"chat file upload|chat-files|storage|IOException|UnauthorizedAccessException|No space|permission|temporarily unavailable|failed|exception\" || true
            echo \"=== journalctl tail ===\"
            journalctl -u \"$BACKEND_SERVICE\" -n 240 --no-pager || true
          '"
