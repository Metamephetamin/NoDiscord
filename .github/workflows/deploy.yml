name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  DOTNET_VERSION: "8.0.x"

jobs:
  guard-master:
    name: Проверить release-ветку
    runs-on: ubuntu-latest

    steps:
      - name: Проверить, что workflow запущен из master
        shell: bash
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF_NAME" != "master" ]; then
            echo "Продакшен-деплой разрешён только из ветки master. Текущая ветка: $GITHUB_REF_NAME" >&2
            exit 1
          fi

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: guard-master
    environment: production
    timeout-minutes: 40
    outputs:
      deploy_ready: ${{ steps.validate.outputs.ready }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Production release gate
        run: node ./scripts/verify-release-gate.mjs

      - name: Check encoding
        run: npm run check:encoding

      - name: Test encoding guard
        run: npm run test:encoding

      - name: Build frontend
        run: npm run build:frontend

      - name: Measure frontend package
        shell: bash
        run: |
          set -euo pipefail
          echo "Frontend dist directory size:"
          du -sh ./dist

      - name: Restore backend
        run: dotnet restore BackNoDiscord/BackNoDiscord.sln

      - name: Test backend before deploy
        run: dotnet test BackNoDiscord/BackNoDiscord.Tests/BackNoDiscord.Tests.csproj --configuration Release --no-restore

      - name: Run release smoke
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
          SMOKE_TEST_TOTP_CODE: ${{ secrets.SMOKE_TEST_TOTP_CODE }}
          SMOKE_CHAT_ID: ${{ vars.SMOKE_CHAT_ID }}
          SMOKE_CHAT_WRITE: ${{ vars.SMOKE_CHAT_WRITE }}
          SMOKE_VOICE_CHANNEL: ${{ vars.SMOKE_VOICE_CHANNEL }}
        run: npm run smoke:release

      - name: Publish backend
        run: dotnet publish BackNoDiscord/BackNoDiscord/BackNoDiscord.csproj --configuration Release --no-restore --output ./artifacts/backend

      - name: Measure backend package
        shell: bash
        run: |
          set -euo pipefail
          echo "Backend publish directory size:"
          du -sh ./artifacts/backend

      - name: Generate migration preflight script
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet tool run dotnet-ef migrations script --idempotent \
            --project BackNoDiscord/BackNoDiscord/BackNoDiscord.csproj \
            --startup-project BackNoDiscord/BackNoDiscord/BackNoDiscord.csproj \
            --output ./artifacts/backend-migrations.sql
          test -s ./artifacts/backend-migrations.sql

      - name: Upload migration preflight artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-migrations-sql
          path: ./artifacts/backend-migrations.sql
          retention-days: 14

      - name: Validate deploy secrets
        id: validate
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets are not fully configured. Skipping deploy step."
            exit 0
          fi
          if [ -z "$DEPLOY_SSH_KNOWN_HOSTS" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_SSH_KNOWN_HOSTS is empty or missing. Configure pinned SSH known_hosts before deploying."
            exit 0
          fi
          if [ -n "$BACKEND_ENV_FILE" ]; then
            echo "has_backend_env=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_backend_env=false" >> "$GITHUB_OUTPUT"
            echo "BACKEND_ENV_FILE is empty or missing. Deploy will continue without replacing backend .env."
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Prepare deploy SSH key
        if: steps.validate.outputs.ready == 'true'
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

      - name: Install pinned deploy known_hosts
        if: steps.validate.outputs.ready == 'true'
        shell: bash
        env:
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -l -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: SSH preflight
        if: steps.validate.outputs.ready == 'true'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -p $PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=20"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "true"

      - name: Sync frontend dist to server
        if: steps.validate.outputs.ready == 'true'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          FRONTEND_DEPLOY_PATH: ${{ vars.FRONTEND_DEPLOY_PATH }}
          BACKEND_DEPLOY_PATH: ${{ vars.BACKEND_DEPLOY_PATH }}
          FRONTEND_DEPLOY_OWNER: ${{ vars.FRONTEND_DEPLOY_OWNER }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          FRONTEND_PATH="${FRONTEND_DEPLOY_PATH:-/var/www/tend-app/current}"
          FRONTEND_OWNER="${FRONTEND_DEPLOY_OWNER:-www-data:www-data}"
          TEMP_ROOT="/tmp/tend-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          FRONTEND_SOURCE="./dist"
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -p $PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"

          echo "Frontend deploy target: $DEPLOY_USER@$DEPLOY_HOST:$FRONTEND_PATH"
          if [ -d "$FRONTEND_SOURCE/dist" ]; then
            FRONTEND_SOURCE="$FRONTEND_SOURCE/dist"
          fi
          if [ ! -f "$FRONTEND_SOURCE/index.html" ]; then
            echo "Frontend dist is missing index.html: $FRONTEND_SOURCE" >&2
            exit 1
          fi
          echo "Creating frontend directories on server"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$TEMP_ROOT' '$FRONTEND_PATH'"

          echo "Syncing changed frontend files"
          case "$FRONTEND_PATH" in
            /var/www/*) ;;
            *)
              echo "Unsafe frontend deploy path: $FRONTEND_PATH" >&2
              exit 1
              ;;
          esac
          rsync -az --checksum --chown="$FRONTEND_OWNER" --info=progress2 --timeout=60 -e "ssh $SSH_OPTS" "$FRONTEND_SOURCE/" "$DEPLOY_USER@$DEPLOY_HOST:$FRONTEND_PATH/"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "find '$FRONTEND_PATH/assets' -type f -mtime +14 -delete 2>/dev/null || true"
          echo "Frontend deploy sync completed"

      - name: Sync backend publish to server
        if: steps.validate.outputs.ready == 'true'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          BACKEND_DEPLOY_PATH: ${{ vars.BACKEND_DEPLOY_PATH }}
          BACKEND_DEPLOY_OWNER: ${{ vars.BACKEND_DEPLOY_OWNER }}
          BACKEND_STORAGE_PATH: ${{ vars.BACKEND_STORAGE_PATH }}
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
          YOOKASSA_SHOP_ID: ${{ secrets.YOOKASSA_SHOP_ID }}
          YOOKASSA_SECRET_KEY: ${{ secrets.YOOKASSA_SECRET_KEY }}
          YOOKASSA_RETURN_URL: ${{ secrets.YOOKASSA_RETURN_URL }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          BACKEND_PATH="${BACKEND_DEPLOY_PATH:-/opt/nodiscord/.deploy/backend}"
          BACKEND_OWNER="${BACKEND_DEPLOY_OWNER:-nodiscord:nodiscord}"
          STORAGE_PATH="${BACKEND_STORAGE_PATH:-/opt/nodiscord/.deploy/storage}"
          TEMP_ROOT="/tmp/tend-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TEMP_ENV_FILE="$TEMP_ROOT/backend.env"
          TEMP_YOOKASSA_ENV_FILE="$TEMP_ROOT/yookassa.env"
          BACKEND_SOURCE="./artifacts/backend"
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -p $PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"

          echo "Backend deploy target: $DEPLOY_USER@$DEPLOY_HOST:$BACKEND_PATH"
          if [ -d "$BACKEND_SOURCE/backend" ]; then
            BACKEND_SOURCE="$BACKEND_SOURCE/backend"
          fi
          if [ ! -f "$BACKEND_SOURCE/BackNoDiscord.dll" ]; then
            echo "Backend publish is missing BackNoDiscord.dll: $BACKEND_SOURCE" >&2
            exit 1
          fi
          echo "Creating backend directories on server"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$TEMP_ROOT' '$BACKEND_PATH'"

          echo "Syncing changed backend files"
          case "$BACKEND_PATH" in
            /opt/nodiscord/*) ;;
            *)
              echo "Unsafe backend deploy path: $BACKEND_PATH" >&2
              exit 1
              ;;
          esac
          case "$STORAGE_PATH" in
            /opt/nodiscord/*) ;;
            *)
              echo "Unsafe backend storage path: $STORAGE_PATH" >&2
              exit 1
              ;;
          esac
          echo "Migrating existing uploaded files before backend sync"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "timeout 5m bash -lc '
            set -e
            BACKEND_PATH='$BACKEND_PATH'
            STORAGE_PATH='$STORAGE_PATH'
            mkdir -p \"\$STORAGE_PATH\"
            for directory in avatars profile-backgrounds server-icons chat-files; do
              mkdir -p \"\$STORAGE_PATH/\$directory\"
              if [ -d \"\$BACKEND_PATH/wwwroot/\$directory\" ]; then
                find \"\$BACKEND_PATH/wwwroot/\$directory\" -mindepth 1 -maxdepth 1 -exec cp -a -n {} \"\$STORAGE_PATH/\$directory/\" \\;
              fi
            done
          '"
          rsync -az --checksum --delete-delay --chown="$BACKEND_OWNER" --exclude='.env' --info=progress2 --timeout=60 -e "ssh $SSH_OPTS" "$BACKEND_SOURCE/" "$DEPLOY_USER@$DEPLOY_HOST:$BACKEND_PATH/"
          if [ -n "$BACKEND_ENV_FILE" ]; then
            if ! printf '%s\n' "$BACKEND_ENV_FILE" | grep -q '^ConnectionStrings__DefaultConnection='; then
              echo "BACKEND_ENV_FILE must contain ConnectionStrings__DefaultConnection." >&2
              exit 1
            fi
            if ! printf '%s\n' "$BACKEND_ENV_FILE" | grep -q '^Jwt__Key='; then
              echo "BACKEND_ENV_FILE must contain Jwt__Key." >&2
              exit 1
            fi
            if ! printf '%s\n' "$BACKEND_ENV_FILE" | grep -q '^Crypto__Key='; then
              echo "BACKEND_ENV_FILE must contain Crypto__Key." >&2
              exit 1
            fi
            echo "Uploading backend .env file"
            printf '%s\n' "$BACKEND_ENV_FILE" | ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "cat > '$TEMP_ENV_FILE'"
          fi
          if [ -n "$YOOKASSA_SHOP_ID" ] || [ -n "$YOOKASSA_SECRET_KEY" ] || [ -n "$YOOKASSA_RETURN_URL" ]; then
            if [ -z "$YOOKASSA_SHOP_ID" ] || [ -z "$YOOKASSA_SECRET_KEY" ]; then
              echo "YOOKASSA_SHOP_ID and YOOKASSA_SECRET_KEY must be configured together." >&2
              exit 1
            fi
            echo "Uploading YooKassa backend environment overlay"
            {
              printf 'YooKassa__ShopId=%s\n' "$YOOKASSA_SHOP_ID"
              printf 'YooKassa__SecretKey=%s\n' "$YOOKASSA_SECRET_KEY"
              if [ -n "$YOOKASSA_RETURN_URL" ]; then
                printf 'YooKassa__ReturnUrl=%s\n' "$YOOKASSA_RETURN_URL"
              else
                printf 'YooKassa__ReturnUrl=https://lanaya.space\n'
              fi
            } | ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "cat > '$TEMP_YOOKASSA_ENV_FILE'"
          fi

          echo "Applying backend environment on server"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "timeout 15m bash -lc '
            set -e
            BACKEND_PATH='$BACKEND_PATH'
            STORAGE_PATH='$STORAGE_PATH'
            TEMP_ROOT='$TEMP_ROOT'
            TEMP_ENV_FILE='$TEMP_ENV_FILE'
            TEMP_YOOKASSA_ENV_FILE='$TEMP_YOOKASSA_ENV_FILE'
            BACKEND_OWNER='$BACKEND_OWNER'
            case \"\$BACKEND_PATH\" in
              /opt/nodiscord/*) ;;
              *)
                echo \"Unsafe backend deploy path: \$BACKEND_PATH\" >&2
                exit 1
                ;;
            esac
            case \"\$STORAGE_PATH\" in
              /opt/nodiscord/*) ;;
              *)
                echo \"Unsafe backend storage path: \$STORAGE_PATH\" >&2
                exit 1
                ;;
            esac
            if [ -f \"\$TEMP_ENV_FILE\" ]; then
              mv \"\$TEMP_ENV_FILE\" \"\$BACKEND_PATH/.env\"
            fi
            if [ ! -f \"\$BACKEND_PATH/.env\" ]; then
              echo \"Backend environment file is missing: \$BACKEND_PATH/.env\"
              echo \"Set BACKEND_ENV_FILE to the full production .env before deploying.\" >&2
              exit 1
            else
              previous_storage_root=\$(grep -E \"^(Storage__Root|Storage:Root|ND_STORAGE_ROOT)=\" \"\$BACKEND_PATH/.env\" | tail -n 1 | cut -d= -f2- || true)
              mkdir -p \"\$STORAGE_PATH\"
              legacy_roots=\"\$BACKEND_PATH/wwwroot /opt/nodiscord/storage /opt/nodiscord/.deploy/backend/wwwroot\"
              if [ -n \"\$previous_storage_root\" ]; then
                legacy_roots=\"\$previous_storage_root \$legacy_roots\"
              fi
              for source_root in \$legacy_roots; do
                if [ -z \"\$source_root\" ] || [ \"\$source_root\" = \"\$STORAGE_PATH\" ]; then
                  continue
                fi
                case \"\$source_root\" in
                  /opt/nodiscord/*) ;;
                  *)
                    echo \"Skipping unsafe legacy storage root: \$source_root\"
                    continue
                    ;;
                esac
                for directory in avatars profile-backgrounds server-icons chat-files; do
                  mkdir -p \"\$STORAGE_PATH/\$directory\"
                  if [ -d \"\$source_root/\$directory\" ]; then
                    echo \"Migrating existing files from \$source_root/\$directory\"
                    find \"\$source_root/\$directory\" -mindepth 1 -maxdepth 1 -exec cp -a -n {} \"\$STORAGE_PATH/\$directory/\" \\;
                  fi
                done
              done
              find \"\$STORAGE_PATH/chat-files\" -maxdepth 1 -type f -name \"upload-*.tmp\" -mmin +60 -delete 2>/dev/null || true
              sed -i.bak -E \"/^(Storage__Root|Storage:Root|ND_STORAGE_ROOT)=/d\" \"\$BACKEND_PATH/.env\"
              printf \"\\nStorage__Root=%s\\n\" \"\$STORAGE_PATH\" >> \"\$BACKEND_PATH/.env\"
              echo \"Production storage root forced to: \$STORAGE_PATH\"
              sed -i.bak -E \"/^(ChatFiles__MaxFileSizeBytes|ChatFiles:MaxFileSizeBytes)=/d\" \"\$BACKEND_PATH/.env\"
              printf \"ChatFiles__MaxFileSizeBytes=104857600\\n\" >> \"\$BACKEND_PATH/.env\"
              echo \"Production chat upload limit forced to: 104857600 bytes\"
              sed -i.bak -E \"/^(Cors__AllowedOrigins|Cors:AllowedOrigins|ND_ALLOWED_ORIGINS|ND_PUBLIC_APP_URL|ND_API_URL|ND_LIVEKIT_URL|LiveKit__Url)=/d\" \"\$BACKEND_PATH/.env\"
              {
                printf \"Cors__AllowedOrigins=https://lanaya.space;https://www.lanaya.space\\n\"
                printf \"ND_ALLOWED_ORIGINS=https://lanaya.space;https://www.lanaya.space\\n\"
                printf \"ND_PUBLIC_APP_URL=https://lanaya.space\\n\"
                printf \"ND_API_URL=https://lanaya.space\\n\"
                printf \"ND_LIVEKIT_URL=wss://lanaya.space/livekit\\n\"
                printf \"LiveKit__Url=wss://lanaya.space/livekit\\n\"
              } >> \"\$BACKEND_PATH/.env\"
              echo \"Production public origins forced to lanaya.space\"
              if [ -f \"\$TEMP_YOOKASSA_ENV_FILE\" ]; then
                sed -i.bak -E \"/^(YooKassa__ShopId|YooKassa:ShopId|YooKassa__SecretKey|YooKassa:SecretKey|YooKassa__ReturnUrl|YooKassa:ReturnUrl)=/d\" \"\$BACKEND_PATH/.env\"
                cat \"\$TEMP_YOOKASSA_ENV_FILE\" >> \"\$BACKEND_PATH/.env\"
                echo \"YooKassa payment settings applied from GitHub Secrets\"
              fi
              chown -R \"\$BACKEND_OWNER\" \"\$STORAGE_PATH\"
              chown \"\$BACKEND_OWNER\" \"\$BACKEND_PATH/.env\"
              chmod 600 \"\$BACKEND_PATH/.env\"
              backend_user=\"\${BACKEND_OWNER%%:*}\"
              write_probe=\"\$STORAGE_PATH/chat-files/.write-test\"
              probe_size_mb=8
              if command -v runuser >/dev/null 2>&1 && id \"\$backend_user\" >/dev/null 2>&1; then
                runuser -u \"\$backend_user\" -- dd if=/dev/zero of=\"\$write_probe\" bs=1M count=\"\$probe_size_mb\" conv=fsync status=none
                runuser -u \"\$backend_user\" -- rm -f \"\$write_probe\"
              else
                dd if=/dev/zero of=\"\$write_probe\" bs=1M count=\"\$probe_size_mb\" conv=fsync status=none
                rm -f \"\$write_probe\"
              fi
              df -h \"\$STORAGE_PATH\" \"\$STORAGE_PATH/chat-files\" || true
              df -B1 \"\$STORAGE_PATH\" \"\$STORAGE_PATH/chat-files\" || true
              for directory in avatars profile-backgrounds server-icons chat-files; do
                count=\$(find \"\$STORAGE_PATH/\$directory\" -maxdepth 1 -type f 2>/dev/null | wc -l)
                echo \"Storage file count \$directory: \$count\"
              done
            fi
            echo \"Backend environment apply completed\"
          '"

      - name: Enable free single-server scaling layer
        if: steps.validate.outputs.ready == 'true'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          BACKEND_DEPLOY_PATH: ${{ vars.BACKEND_DEPLOY_PATH }}
          BACKEND_DEPLOY_OWNER: ${{ vars.BACKEND_DEPLOY_OWNER }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          BACKEND_PATH="${BACKEND_DEPLOY_PATH:-/opt/nodiscord/.deploy/backend}"
          BACKEND_OWNER="${BACKEND_DEPLOY_OWNER:-nodiscord:nodiscord}"
          TEMP_ROOT="/tmp/tend-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -p $PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"

          rsync -az --checksum -e "ssh $SSH_OPTS" scripts/db-backup.sh "$DEPLOY_USER@$DEPLOY_HOST:$TEMP_ROOT/db-backup.sh"
          rsync -az --checksum -e "ssh $SSH_OPTS" scripts/storage-backup.sh "$DEPLOY_USER@$DEPLOY_HOST:$TEMP_ROOT/storage-backup.sh"
          rsync -az --checksum -e "ssh $SSH_OPTS" infra/systemd/nodiscord-db-backup.service "$DEPLOY_USER@$DEPLOY_HOST:$TEMP_ROOT/nodiscord-db-backup.service"
          rsync -az --checksum -e "ssh $SSH_OPTS" infra/systemd/nodiscord-db-backup.timer "$DEPLOY_USER@$DEPLOY_HOST:$TEMP_ROOT/nodiscord-db-backup.timer"
          rsync -az --checksum -e "ssh $SSH_OPTS" infra/systemd/nodiscord-storage-backup.service "$DEPLOY_USER@$DEPLOY_HOST:$TEMP_ROOT/nodiscord-storage-backup.service"
          rsync -az --checksum -e "ssh $SSH_OPTS" infra/systemd/nodiscord-storage-backup.timer "$DEPLOY_USER@$DEPLOY_HOST:$TEMP_ROOT/nodiscord-storage-backup.timer"
          rsync -az --checksum -e "ssh $SSH_OPTS" infra/systemd/nodiscord-backend@.service "$DEPLOY_USER@$DEPLOY_HOST:$TEMP_ROOT/nodiscord-backend@.service"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$TEMP_ROOT/redis'"
          rsync -az --checksum -e "ssh $SSH_OPTS" infra/redis/docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:$TEMP_ROOT/redis/docker-compose.yml"

          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "timeout 10m bash -lc '
            set -e
            BACKEND_PATH='$BACKEND_PATH'
            BACKEND_OWNER='$BACKEND_OWNER'
            TEMP_ROOT='$TEMP_ROOT'
            SCRIPT_DIR=/opt/nodiscord/.deploy/scripts
            REDIS_DIR=/opt/nodiscord/.deploy/redis
            run_root() {
              if \"\$@\"; then
                return 0
              fi
              if command -v sudo >/dev/null 2>&1; then
                sudo -n \"\$@\"
                return \$?
              fi
              return 1
            }

            mkdir -p \"\$SCRIPT_DIR\" \"\$REDIS_DIR\" /opt/nodiscord/.deploy/backups/postgres /opt/nodiscord/.deploy/backups/storage
            cp \"\$TEMP_ROOT/db-backup.sh\" \"\$SCRIPT_DIR/db-backup.sh\"
            cp \"\$TEMP_ROOT/storage-backup.sh\" \"\$SCRIPT_DIR/storage-backup.sh\"
            chmod 750 \"\$SCRIPT_DIR/db-backup.sh\"
            chmod 750 \"\$SCRIPT_DIR/storage-backup.sh\"
            cp \"\$TEMP_ROOT/redis/docker-compose.yml\" \"\$REDIS_DIR/docker-compose.yml\"

            run_root cp \"\$TEMP_ROOT/nodiscord-db-backup.service\" /etc/systemd/system/nodiscord-db-backup.service
            run_root cp \"\$TEMP_ROOT/nodiscord-db-backup.timer\" /etc/systemd/system/nodiscord-db-backup.timer
            run_root cp \"\$TEMP_ROOT/nodiscord-storage-backup.service\" /etc/systemd/system/nodiscord-storage-backup.service
            run_root cp \"\$TEMP_ROOT/nodiscord-storage-backup.timer\" /etc/systemd/system/nodiscord-storage-backup.timer
            run_root cp \"\$TEMP_ROOT/nodiscord-backend@.service\" /etc/systemd/system/nodiscord-backend@.service
            run_root systemctl daemon-reload
            run_root systemctl enable --now nodiscord-db-backup.timer
            run_root systemctl enable --now nodiscord-storage-backup.timer

            redis_ready=0
            if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
              docker compose -f \"\$REDIS_DIR/docker-compose.yml\" up -d
              redis_ready=1
            elif command -v redis-server >/dev/null 2>&1; then
              run_root systemctl enable --now redis-server || run_root systemctl enable --now redis || true
              redis_ready=1
            elif command -v apt-get >/dev/null 2>&1; then
              run_root apt-get update
              run_root apt-get install -y redis-server
              run_root systemctl enable --now redis-server || run_root systemctl enable --now redis || true
              redis_ready=1
            else
              echo \"Redis was not enabled because Docker Compose, redis-server, and apt-get are unavailable.\" >&2
            fi

            if [ \"\$redis_ready\" = \"1\" ]; then
              sed -i.bak -E \"/^(Redis__ConnectionString|Redis:ConnectionString|Redis__ChannelPrefix|Redis:ChannelPrefix)=/d\" \"\$BACKEND_PATH/.env\"
              {
                printf \"Redis__ConnectionString=127.0.0.1:6379\\n\"
                printf \"Redis__ChannelPrefix=lanaya-signalr\\n\"
              } >> \"\$BACKEND_PATH/.env\"
              echo \"Redis SignalR backplane enabled through 127.0.0.1:6379\"
            fi

            chown -R \"\$BACKEND_OWNER\" \"\$SCRIPT_DIR\" /opt/nodiscord/.deploy/backups/postgres /opt/nodiscord/.deploy/backups/storage \"\$REDIS_DIR\" || true
            chown \"\$BACKEND_OWNER\" \"\$BACKEND_PATH/.env\"
            chmod 600 \"\$BACKEND_PATH/.env\"
            echo \"Free single-server scaling layer installed\"
          '"

      - name: Ensure production domain on server
        if: steps.validate.outputs.ready == 'true'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          BACKEND_DEPLOY_PATH: ${{ vars.BACKEND_DEPLOY_PATH }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          BACKEND_PATH="${BACKEND_DEPLOY_PATH:-/opt/nodiscord/.deploy/backend}"
          TEMP_ROOT="/tmp/tend-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          NGINX_SOURCE="./infra/nginx/lanaya.space.load-balanced.conf"
          NGINX_BOOTSTRAP_SOURCE="./infra/nginx/lanaya.space.bootstrap.conf"
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -p $PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"

          if [ -z "${CERTBOT_EMAIL:-}" ]; then
            echo "CERTBOT_EMAIL is empty or missing. Configure a monitored ops email before issuing TLS certificates." >&2
            exit 1
          fi
          if [ ! -f "$NGINX_SOURCE" ]; then
            echo "Nginx domain template is missing: $NGINX_SOURCE" >&2
            exit 1
          fi
          if [ ! -f "$NGINX_BOOTSTRAP_SOURCE" ]; then
            echo "Nginx bootstrap template is missing: $NGINX_BOOTSTRAP_SOURCE" >&2
            exit 1
          fi

          rsync -az --checksum -e "ssh $SSH_OPTS" "$NGINX_SOURCE" "$DEPLOY_USER@$DEPLOY_HOST:$TEMP_ROOT/lanaya.space.conf"
          rsync -az --checksum -e "ssh $SSH_OPTS" "$NGINX_BOOTSTRAP_SOURCE" "$DEPLOY_USER@$DEPLOY_HOST:$TEMP_ROOT/lanaya.space.bootstrap.conf"

          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "timeout 10m bash -lc '
            set -e
            BACKEND_PATH='$BACKEND_PATH'
            TEMP_ROOT='$TEMP_ROOT'
            CERTBOT_EMAIL='$CERTBOT_EMAIL'
            NGINX_SITE=/etc/nginx/sites-available/lanaya.space.conf
            NGINX_ENABLED=/etc/nginx/sites-enabled/lanaya.space.conf
            CERT_DIR=/etc/letsencrypt/live/lanaya.space

            if [ ! -s \"\$CERT_DIR/fullchain.pem\" ] || [ ! -s \"\$CERT_DIR/privkey.pem\" ]; then
              cp \"\$TEMP_ROOT/lanaya.space.bootstrap.conf\" \"\$NGINX_SITE\"
              ln -sfn \"\$NGINX_SITE\" \"\$NGINX_ENABLED\"
              nginx -t
              systemctl reload nginx

              if ! command -v certbot >/dev/null 2>&1; then
                echo \"certbot is not installed on the server; cannot issue lanaya.space TLS certificate.\" >&2
                exit 1
              fi

              certbot certonly --webroot -w /var/www/tend-app/current --non-interactive --agree-tos --email \"\$CERTBOT_EMAIL\" --keep-until-expiring -d lanaya.space -d www.lanaya.space
            fi

            if [ ! -s \"\$CERT_DIR/fullchain.pem\" ] || [ ! -s \"\$CERT_DIR/privkey.pem\" ]; then
              echo \"lanaya.space TLS certificate files are missing after certbot.\" >&2
              exit 1
            fi

            if [ ! -f \"\$NGINX_SITE\" ] || ! cmp -s \"\$TEMP_ROOT/lanaya.space.conf\" \"\$NGINX_SITE\"; then
              cp \"\$TEMP_ROOT/lanaya.space.conf\" \"\$NGINX_SITE\"
            fi

            ln -sfn \"\$NGINX_SITE\" \"\$NGINX_ENABLED\"
            nginx -t
            systemctl reload nginx
            echo \"Production domain lanaya.space is configured on nginx\"
          '"

      - name: Restart backend and reload nginx
        if: steps.validate.outputs.ready == 'true'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          BACKEND_SERVICE_NAME: ${{ vars.BACKEND_SERVICE_NAME }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          BACKEND_SERVICE="${BACKEND_SERVICE_NAME:-nodiscord-backend.service}"
          TEMP_ROOT="/tmp/tend-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RUNNER_UTC_EPOCH="$(date -u +%s)"
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -p $PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"

          echo "Restarting backend service and reloading nginx"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "timeout 10m bash -lc '
            set -e
            BACKEND_SERVICE='$BACKEND_SERVICE'
            TEMP_ROOT='$TEMP_ROOT'
            RUNNER_UTC_EPOCH='$RUNNER_UTC_EPOCH'
            run_root() {
              if \"\$@\"; then
                return 0
              fi
              if command -v sudo >/dev/null 2>&1; then
                sudo -n \"\$@\"
                return \$?
              fi
              return 1
            }

            echo \"Server clock before sync: \$(date -u -R)\"
            if command -v timedatectl >/dev/null 2>&1; then
              run_root timedatectl set-ntp true || true
              timedatectl status || true
              timedatectl timesync-status || true
            fi
            if systemctl list-unit-files systemd-timesyncd.service >/dev/null 2>&1; then
              run_root systemctl restart systemd-timesyncd.service || true
            fi
            if command -v chronyc >/dev/null 2>&1; then
              chronyc -a \"burst 4/4\" || true
              chronyc -a makestep || true
              chronyc tracking || true
            fi
            if command -v ntpdate >/dev/null 2>&1; then
              run_root ntpdate -u pool.ntp.org || true
            fi
            server_epoch=\"\$(date -u +%s)\"
            clock_skew=\"\$((server_epoch - RUNNER_UTC_EPOCH))\"
            if [ \"\$clock_skew\" -lt 0 ]; then
              clock_skew=\"\$((-clock_skew))\"
            fi
            if [ \"\$clock_skew\" -gt 120 ]; then
              echo \"NTP did not correct clock quickly enough; attempting manual UTC step from runner time\"
              run_root date -u -s \"@\${RUNNER_UTC_EPOCH}\" || true
            fi
            echo \"Server clock after sync: \$(date -u -R)\"
            run_root systemctl restart \"\$BACKEND_SERVICE\"
            systemctl is-active \"\$BACKEND_SERVICE\"
            run_root systemctl reload nginx
            rm -rf \"\$TEMP_ROOT\"
            echo \"Backend restart and nginx reload completed\"
          '"

  health-checks:
    name: Health Checks
    runs-on: ubuntu-latest
    needs: deploy
    if: needs.deploy.outputs.deploy_ready == 'true'
    environment: production

    steps:
      - name: Run production health checks
        id: production_health
        continue-on-error: true
        shell: bash
        env:
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          HEALTHCHECK="https://lanaya.space"
          if [ -n "${HEALTHCHECK_URL:-}" ] && [ "$HEALTHCHECK_URL" != "$HEALTHCHECK" ]; then
            echo "Unsupported production healthcheck URL: $HEALTHCHECK_URL. tendsec.ru is not production; use https://lanaya.space." >&2
            exit 1
          fi
          API_HEALTHCHECK="${HEALTHCHECK%/}/api/ping"
          CHAT_NEGOTIATE_HEALTHCHECK="${HEALTHCHECK%/}/chatHub/negotiate?negotiateVersion=1"
          VOICE_NEGOTIATE_HEALTHCHECK="${HEALTHCHECK%/}/voiceHub/negotiate?negotiateVersion=1"

          retry_healthcheck() {
            local label="$1"
            shift
            local attempt
            for attempt in {1..12}; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 12 ]; then
                echo "$label healthcheck failed on attempt $attempt; retrying in 5s..." >&2
                sleep 5
              fi
            done
            echo "$label healthcheck failed after 12 attempts." >&2
            return 1
          }

          check_frontend_once() {
            echo "Running frontend healthcheck: $HEALTHCHECK"
            local frontend_redirect
            frontend_redirect="$(curl --silent --show-error --output /dev/null --write-out '%{redirect_url}' "$HEALTHCHECK")" || return 1
            if [ -n "$frontend_redirect" ]; then
              echo "Frontend healthcheck unexpectedly redirects to: $frontend_redirect" >&2
              return 1
            fi
            curl --fail --silent --show-error "$HEALTHCHECK" > /dev/null || return 1
          }

          check_api_once() {
            echo "Running backend API healthcheck: $API_HEALTHCHECK"
            local api_redirect api_body api_headers api_date api_date_epoch now_epoch clock_skew
            api_redirect="$(curl --silent --show-error --output /dev/null --write-out '%{redirect_url}' "$API_HEALTHCHECK")" || return 1
            if [ -n "$api_redirect" ]; then
              echo "Backend API healthcheck unexpectedly redirects to: $api_redirect" >&2
              return 1
            fi
            api_body="$(curl --fail --silent --show-error "$API_HEALTHCHECK")" || return 1
            if ! printf '%s\n' "$api_body" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              echo "Backend API ping did not return status ok: $api_body" >&2
              return 1
            fi
            api_headers="$(mktemp)"
            if ! curl --fail --silent --show-error --dump-header "$api_headers" --output /dev/null "$API_HEALTHCHECK"; then
              rm -f "$api_headers"
              return 1
            fi
            api_date="$(awk 'BEGIN{IGNORECASE=1} /^date:/ { sub(/^[Dd]ate:[[:space:]]*/, ""); gsub(/\r$/, ""); print; exit }' "$api_headers")"
            if [ -z "$api_date" ]; then
              echo "Backend API response did not include a Date header." >&2
              cat "$api_headers" >&2
              rm -f "$api_headers"
              return 1
            fi
            api_date_epoch="$(date -u -d "$api_date" +%s)"
            now_epoch="$(date -u +%s)"
            clock_skew="$((now_epoch - api_date_epoch))"
            if [ "$clock_skew" -lt 0 ]; then
              clock_skew="$((-clock_skew))"
            fi
            if [ "$clock_skew" -gt 120 ]; then
              echo "::warning::Production clock skew is too high: ${clock_skew}s (server Date: $api_date). TOTP verification currently tolerates this temporarily, but server NTP must be fixed."
            fi
            if ! grep -iq "content-security-policy:.*wss://lanaya.space" "$api_headers"; then
              echo "Backend CSP does not allow lanaya.space websocket connections." >&2
              cat "$api_headers" >&2
              rm -f "$api_headers"
              return 1
            fi
            rm -f "$api_headers"
          }

          check_hub_once() {
            local label="$1"
            local url="$2"
            local redirect status
            echo "Running $label negotiate healthcheck: $url"
            redirect="$(curl --silent --show-error --request POST --output /dev/null --write-out '%{redirect_url}' "$url")" || return 1
            if [ -n "$redirect" ]; then
              echo "$label negotiate healthcheck unexpectedly redirects to: $redirect" >&2
              return 1
            fi
            status="$(curl --silent --show-error --request POST --output /dev/null --write-out '%{http_code}' "$url")" || return 1
            if [ "$status" -ge 500 ] || [ "$status" -eq 000 ]; then
              echo "$label negotiate endpoint is unhealthy (HTTP $status)." >&2
              return 1
            fi
          }

          retry_healthcheck "frontend" check_frontend_once
          retry_healthcheck "backend API" check_api_once
          retry_healthcheck "chat negotiate" check_hub_once "Chat hub" "$CHAT_NEGOTIATE_HEALTHCHECK"
          retry_healthcheck "voice negotiate" check_hub_once "Voice hub" "$VOICE_NEGOTIATE_HEALTHCHECK"

      - name: Collect backend diagnostics
        if: steps.production_health.outcome == 'failure'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          BACKEND_SERVICE_NAME: ${{ vars.BACKEND_SERVICE_NAME }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          BACKEND_SERVICE="${BACKEND_SERVICE_NAME:-nodiscord-backend.service}"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -l -f "$HOME/.ssh/known_hosts" >/dev/null
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -p $PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "bash -lc '
            echo \"=== server clock ===\"
            date -u -R || true
            timedatectl status || true
            timedatectl timesync-status || true
            chronyc tracking || true
            echo \"=== systemctl status ===\"
            systemctl status \"$BACKEND_SERVICE\" --no-pager || true
            echo \"=== journalctl ===\"
            journalctl -u \"$BACKEND_SERVICE\" -n 160 --no-pager || true
          '"

      - name: Fail production health checks
        if: steps.production_health.outcome == 'failure'
        shell: bash
        run: exit 1
